<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Preview</title></head><body>
<script>
// Sandbox host: receives generated HTML from the parent and renders it. Served with a CSP that blocks all network access.
var REPORTER = '<script>addEventListener("error",function(e){parent.postMessage({type:"error",msg:String(e.message||e.error||"Unknown error")},"*")});addEventListener("unhandledrejection",function(e){parent.postMessage({type:"error",msg:String(e.reason)},"*")})<\/script>';
function withReporter(html) {
  if (/<head[^>]*>/i.test(html)) return html.replace(/<head[^>]*>/i, function (m) { return m + REPORTER; });
  if (/<html[^>]*>/i.test(html)) return html.replace(/<html[^>]*>/i, function (m) { return m + REPORTER; });
  return REPORTER + html;
}
addEventListener('message', function (e) {
  if (e.source !== parent || !e.data || e.data.type !== 'load' || typeof e.data.html !== 'string') return;
  document.open(); document.write(withReporter(e.data.html)); document.close();
});
</script>
</body></html>
